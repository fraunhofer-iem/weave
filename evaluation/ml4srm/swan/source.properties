# 0 = let the OS pick a free port
port = 0
dataset.train = ${WEAVE_HOME}/evaluation/ml4srm/swan/source/source-dataset.arff
dataset.test = ${WEAVE_HOME}/evaluation/ml4srm/swan/source/source-gxa-dataset.arff

# ------ML-Plan configuration

#duration in minutes
mlplan.timeout = 480
mlplan.timeout.node = 30
mlplan.timeout.candidate = 10
mlplan.seed = 557
mlplan.cpu = 64

#-----Empirical evaluation
jaicore.databaseConfig = ${WEAVE_HOME}/evaluation/ml4srm/swan/db2.properties
jaicore.experimentConfig = ${WEAVE_HOME}/evaluation/ml4srm/swan/source/experiments.cnf

#-----Paths
paths.explainer = ${WEAVE_HOME}/cli/src/main/java/de/fraunhofer/iem/weave/module/explainer/shap/shap_explainer.py
paths.output = ${WEAVE_HOME}/evaluation/ml4srm/swan/source/explanations/${MODEL_TAG:-published}
paths.python = python

shap.global.bg.samples = 500
shap.global.exp.samples = 500

shap.local.bg.samples = 250
shap.local.exp.samples = 250